# MNIST Handwritten Digit Recognition

## Project Overview
This project is an interactive handwritten digit recognition application built using a Convolutional Neural Network (CNN), TensorFlow and Streamlit. It allows users to upload an image of a handwritten digit (0–9) and receive a predicted digit with its confidence score.

## Technology Stack
- **Python:** Programming language
- **TensorFlow 2.21.0:** Deep learning framework
- **Streamlit 1.67.0:** Interactive web application
- **NumPy:** Numerical processing
- **Pillow:** Image processing
- **Docker:** Application containerization
- **GitHub:** Version control and source code hosting
- **Streamlit Community Cloud:** Cloud deployment

