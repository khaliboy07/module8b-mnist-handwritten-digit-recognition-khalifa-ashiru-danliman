## How to Run the Application Locally

1. Clone the repository:

```bash
git clone https://github.com/khaliboy07/mnist-digit-recognition.git
```

2. Enter the project directory:

```bash
cd mnist-digit-recognition
```

3. Install the dependencies:

```bash
pip install -r requirements.txt
```

4. Start the Streamlit application:

```bash
streamlit run app.py
```

5. Open the local URL displayed in your terminal.

## Running with Docker

Ensure Docker and Docker Compose are installed.

Build and start the application:

```bash
docker compose up --build
```

Open:

```text
http://localhost:8501
```

To stop the container:

```bash
docker compose down
```

## How to Use the Application

1. Open the application.
2. Upload an image containing a handwritten digit.
3. Click the **Predict Digit** button.
4. View the processed image.
5. View the predicted digit, confidence score and prediction probabilities.

